name: Build geosite.dat

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: latest-geosite-${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.1"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build source lists
        run: python scripts/build_lists.py

      - name: Build sing-box rule-set sources
        run: python scripts/build_singbox_rulesets.py --output-dir "$RUNNER_TEMP/singbox-source"

      - name: Build geosite.dat
        run: |
          git clone https://github.com/v2fly/domain-list-community.git dlc
          cd dlc
          go mod download
          go run ./ --datapath=../data
          mv dlc.dat ../geosite.dat

      - name: Install sing-box
        run: |
          go install github.com/sagernet/sing-box/cmd/sing-box@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build sing-box rule-sets
        run: |
          mkdir -p sing-box
          for source in "$RUNNER_TEMP"/singbox-source/*.json; do
            name="$(basename "$source" .json)"
            sing-box rule-set compile --output "sing-box/${name}.srs" "$source"
            sha256sum "sing-box/${name}.srs" > "sing-box/${name}.srs.sha256"
          done

      - name: Create checksum
        run: sha256sum geosite.dat > geosite.dat.sha256

      - name: Commit generated data to main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: update generated source lists"
          git push

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          path: release-branch

      - name: Publish files to release branch
        run: |
          find release-branch -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp geosite.dat release-branch/geosite.dat
          cp geosite.dat.sha256 release-branch/geosite.dat.sha256
          cp -R sing-box release-branch/sing-box

          cd release-branch
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: publish latest geosite.dat" || echo "No changes to commit"
          git push

      - name: Create release tag
        run: |
          git tag "${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Latest geosite.dat and sing-box rule-sets
          body: |
            Automated latest build of geosite.dat and sing-box rule-sets

            Raw URL:
            https://raw.githubusercontent.com/yularzhi/geosite_russia/release/geosite.dat
          files: |
            geosite.dat
            geosite.dat.sha256
            sing-box/*.srs
            sing-box/*.srs.sha256
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geosite-and-sing-box
          path: |
            geosite.dat
            geosite.dat.sha256
            sing-box/*.srs
            sing-box/*.srs.sha256
