[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosite-russia"
version = "0.1.0"
description = "Custom geosite.dat and sing-box rule-set builder for Russia"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pre-commit",
]

[project.scripts]
geosite-build = "geosite_russia.build_lists:main"
geosite-singbox = "geosite_russia.build_singbox_rulesets:main"

[tool.setuptools.packages.find]
include = ["geosite_russia*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["geosite_russia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
