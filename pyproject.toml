[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E402",   # module level import not at top (needed for sys.path.insert + package imports)
]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
